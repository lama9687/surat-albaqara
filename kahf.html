<div class="hero-text"><h2>في كوخ على طرف غابة</h2></div></div>
  <div class="reader-bar">
    <div class="wrap">
      <button class="back" id="back">→ الرئيسية</button>
      <div class="tools">
        <button class="tool" id="smaller" aria-label="تصغير الخط">أ-</button>
        <button class="tool" id="bigger" aria-label="تكبير الخط">أ+</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="surah-head"><div class="frame"><h1 id="s-name" style="margin:0;font-family:'Amiri Quran',serif;font-size:2.1rem;color:var(--green);font-weight:400">سورة الكهف</h1></div><div class="meta" id="s-meta">سورة الكهف مكتوبة كاملة • مكية • ١١٠ آيات</div></div>
    <div class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <div class="mushaf" id="mushaf"><noscript>لعرض نص سورة الكهف كاملًا يرجى تفعيل JavaScript في المتصفح.</noscript></div>
    <div class="nav-surah" id="nav-surah"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    في كوخ على طرف غابة
    <div class="src">نص القرآن الكريم بالرسم العثماني من مصدر alquran.cloud</div>
  </div>
</footer>

<script>
(function(){
  const SURAHS = {
    baqara:{n:2, name:"سورة البقرة", meta:"مدنية • ٢٨٦ آية"},
    kahf:{n:18, name:"سورة الكهف", meta:"مكية • ١١٠ آيات"}
  };
  const DHIKR = [
    {t:"سُبْحَانَ اللَّهِ", c:33},
    {t:"الْحَمْدُ لِلَّهِ", c:33},
    {t:"اللَّهُ أَكْبَرُ", c:34},
    {t:"لَا إِلَٰهَ إِلَّا اللَّهُ", c:100},
    {t:"أَسْتَغْفِرُ اللَّهَ", c:100},
    {t:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", c:100},
    {t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ", c:100},
    {t:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ", c:10}
  ];
  const $ = s => document.querySelector(s);
  const toAr = n => String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  if($("#dhikr-grid")){
  // ---------- DHIKR ----------
  const counts = JSON.parse(store.get("dhikr-counts")||"{}");
  function renderDhikr(){
    $("#dhikr-grid").innerHTML = DHIKR.map((d,i)=>{
      const v = counts[i]||0, done = v>=d.c;
      return `<div class="dhikr"><p class="txt">${d.t}</p>
        <div class="row"><button class="counter-btn ${done?"done":""}" data-i="${i}">${done?"تم ✓":"سبّح"}</button>
        <span class="count">${toAr(v)} / ${toAr(d.c)}</span>
        <button class="reset" data-r="${i}">إعادة</button></div></div>`;
    }).join("");
  }
  $("#dhikr-grid").addEventListener("click",e=>{
    const b=e.target.closest("[data-i]"), r=e.target.closest("[data-r]");
    if(b){ const i=b.dataset.i; counts[i]=(counts[i]||0)+1; if(navigator.vibrate && counts[i]===DHIKR[i].c) try{navigator.vibrate(60)}catch(_){}; }
    else if(r){ counts[r.dataset.r]=0; } else return;
    store.set("dhikr-counts",JSON.stringify(counts)); renderDhikr();
  });
  renderDhikr();

  }

  if($("#mushaf")){
  // ---------- QURAN ----------
  let size = parseInt(store.get("qsize")||"30",10);
  const applySize = () => document.documentElement.style.setProperty("--qsize", size+"px");
  applySize();
  $("#bigger").onclick = ()=>{ size=Math.min(48,size+2); applySize(); store.set("qsize",size); };
  $("#smaller").onclick = ()=>{ size=Math.max(20,size-2); applySize(); store.set("qsize",size); };
  $("#back").onclick = ()=>{ location.href="index.html#quran"; };

  function stripBasmala(text){
    // الآية الأولى في المصدر تبدأ بالبسملة؛ نعرضها منفصلة فوق السورة
    const words = text.split(" ");
    if(words[0] && words[0].startsWith("بِسْمِ") && words.length>4) return words.slice(4).join(" ");
    return text;
  }

  async function loadSurah(key){
    const s = SURAHS[key];
    $("#s-name").textContent = s.name; $("#s-meta").textContent = s.meta;
    
    const box = $("#mushaf");
    const others = Object.entries(SURAHS).filter(([k])=>k!==key).map(([k,o])=>`<a class="back" href="${k}.html">${o.name} ←</a>`).join("");
    $("#nav-surah").innerHTML = others;
    let ayahs = null;
    const cached = store.get("surah-"+s.n);
    if(cached){ try{ ayahs = JSON.parse(cached); }catch(e){} }
    if(!ayahs){
      box.innerHTML = `<div class="status">جارٍ تحميل ${s.name}...</div>`;
      try{
        const r = await fetch(`https://api.alquran.cloud/v1/surah/${s.n}/quran-uthmani`);
        const j = await r.json();
        if(j.status!=="OK") throw new Error("bad");
        ayahs = j.data.ayahs.map(a=>({n:a.numberInSurah, t:a.text}));
        store.set("surah-"+s.n, JSON.stringify(ayahs));
      }catch(e){
        box.innerHTML = `<div class="status">تعذّر تحميل السورة. تأكدي من اتصالك بالإنترنت.<br><button class="retry" id="retry">إعادة المحاولة</button></div>`;
        $("#retry").onclick = ()=>loadSurah(key);
        return;
      }
    }
    box.innerHTML = ayahs.map(a=>{
      const t = a.n===1 ? stripBasmala(a.t) : a.t;
      return `<span class="ayah">${t}</span><span class="end">﴿${toAr(a.n)}﴾</span> `;
    }).join("");
  }

  // ---------- PAGE ----------
  const page = document.body.dataset.surah;
  if(SURAHS[page]){
    $("#home").style.display="none"; $("#reader").style.display="block"; loadSurah(page);
  }
  }
})();
</script>
</body>
</html>
